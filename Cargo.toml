[package]
name = "agent-observer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[lib]
name = "agent_observer"
path = "src/lib.rs"

[[bin]]
name = "agent-observer"
path = "src/main.rs"
