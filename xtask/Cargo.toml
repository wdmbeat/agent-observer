[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

# Detached crate: not part of the root package, so the platform build
# (`cargo build --release --bin sac-agent` from the packed sources) never
# sees this crate or its dependency tree.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
